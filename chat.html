<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zaka chat</title>
  <link rel="stylesheet" href="/css/zui.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; padding: 20px; overflow: hidden; }
    .hidden { display: none !important; }

    .auth-card {
      width: 100%; max-width: 360px;
      background: rgba(16, 16, 16, 0.96); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7); padding: 28px 26px; display: flex; flex-direction: column; gap: 13px;
    }
    .auth-card h1 { margin: 0 0 4px; font-size: 1.3rem; font-weight: 600; }
    .auth-card p { margin: 0 0 6px; color: var(--text-dim); font-size: .88rem; }
    .auth-card .zui-input { width: 100%; }
    .auth-row { display: flex; gap: 10px; }
    .auth-row .zui-btn { flex: 1; }
    .auth-err { color: #ff6b6b; font-size: .82rem; min-height: 1em; }

    .chat-shell {
      width: 100%; max-width: 880px; height: calc(100vh - 40px);
      background: rgba(16, 16, 16, 0.96); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7); display: flex; overflow: hidden;
    }

    /* channel column */
    .channels { width: 178px; flex-shrink: 0; background: #0b0b0b; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .channels .label { padding: 14px 16px 8px; font-size: .72rem; letter-spacing: .6px; text-transform: uppercase; color: var(--text-muted); }
    .channels .list { flex: 1; overflow-y: auto; padding: 0 8px; }
    .channel { display: flex; align-items: center; gap: 2px; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 2px; border: 0; border-radius: 6px; background: transparent; color: var(--text); }
    .channel .hash { color: var(--text-muted); margin-right: 4px; }
    .channel:hover { background: var(--bg-hover); color: var(--text); }
    .channel.active { background: #1e1e1e; color: var(--text); }
    .me-box { border-top: 1px solid var(--border); padding: 12px 14px; display: flex; align-items: center; gap: 8px; }
    .me-box .who { min-width: 0; flex: 1; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .me-box .logout { padding: 5px 10px; font-size: .75rem; }

    /* main */
    .chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .chat-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; background: #0b0b0b; border-bottom: 1px solid var(--border); }
    .chat-head .dot { width: 9px; height: 9px; border-radius: 50%; background: #d33; flex-shrink: 0; transition: background .2s; }
    .chat-head .dot.on { background: #3ad36b; }
    .chat-head h1 { font-size: 1rem; font-weight: 600; margin: 0; }
    .chat-head .hint { margin-left: auto; font-size: .76rem; color: var(--text-muted); }
    .chat-box { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; }
    .input-area { display: flex; gap: 10px; padding: 14px; background: #0b0b0b; border-top: 1px solid var(--border); }
    .input-area .zui-input { flex: 1; }

    .badge { font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; border-radius: 4px; padding: 1px 5px; margin-left: 5px; vertical-align: middle; }
    .badge.owner { background: rgba(255,196,0,.15); color: #ffce45; border: 1px solid rgba(255,196,0,.35); }
    .badge.admin { background: rgba(77,173,255,.15); color: var(--accent); border: 1px solid rgba(77,173,255,.35); }

    @media (max-width: 640px) {
      body { padding: 0; }
      .chat-shell { height: 100vh; border-radius: 0; max-width: 100%; }
      .channels { width: 128px; }
    }
  </style>
</head>
<body>
  <div class="auth-card" id="auth">
    <h1>zaka chat</h1>
    <p>Create an account or log in to join the chat.</p>
    <input class="zui-input" id="auth-user" maxlength="24" placeholder="username" autocomplete="username" aria-label="username">
    <input class="zui-input" id="auth-pass" type="password" maxlength="128" placeholder="password" autocomplete="current-password" aria-label="password">
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-row">
      <button class="zui-btn" id="btn-login">Log in</button>
      <button class="zui-btn zui-btn-ghost" id="btn-signup">Create account</button>
    </div>
  </div>

  <div class="chat-shell hidden" id="shell">
    <div class="channels">
      <div class="label">Channels</div>
      <div class="list" id="channels"></div>
      <div class="me-box">
        <span class="who" id="who"></span>
        <button class="zui-btn zui-btn-ghost logout" id="logout">Log out</button>
      </div>
    </div>
    <div class="chat-main">
      <div class="chat-head">
        <span class="dot" id="dot"></span>
        <h1 id="channel-title">#general</h1>
        <span class="hint" id="hint"></span>
      </div>
      <div class="chat-box" id="box"></div>
      <div class="input-area">
        <input class="zui-input" id="msg" maxlength="500" placeholder="Message #general  (try /help)" autocomplete="off" aria-label="message">
        <button class="zui-btn" id="send">Send</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    var authCard = document.getElementById("auth");
    var authUser = document.getElementById("auth-user");
    var authPass = document.getElementById("auth-pass");
    var authErr = document.getElementById("auth-err");
    var btnLogin = document.getElementById("btn-login");
    var btnSignup = document.getElementById("btn-signup");

    var shell = document.getElementById("shell");
    var channelsEl = document.getElementById("channels");
    var box = document.getElementById("box");
    var input = document.getElementById("msg");
    var sendBtn = document.getElementById("send");
    var dot = document.getElementById("dot");
    var whoEl = document.getElementById("who");
    var logoutBtn = document.getElementById("logout");
    var titleEl = document.getElementById("channel-title");
    var hintEl = document.getElementById("hint");

    var token = "", myName = "", myRole = "member", channel = "general";
    try { token = localStorage.getItem("zaka_chat_token") || ""; myName = localStorage.getItem("zaka_chat_user") || ""; } catch (e) {}

    function save() { try { localStorage.setItem("zaka_chat_token", token); localStorage.setItem("zaka_chat_user", myName); } catch (e) {} }
    function clearAuth() { token = ""; myName = ""; try { localStorage.removeItem("zaka_chat_token"); localStorage.removeItem("zaka_chat_user"); } catch (e) {} }

    function showAuth() { shell.classList.add("hidden"); authCard.classList.remove("hidden"); authUser.focus(); }
    function showChat() { authCard.classList.add("hidden"); shell.classList.remove("hidden"); input.focus(); }

    async function doAuth(path) {
      var u = authUser.value.trim(), p = authPass.value;
      if (!u || !p) { authErr.textContent = "Enter a username and password."; return; }
      btnLogin.disabled = btnSignup.disabled = true; authErr.textContent = "";
      try {
        var res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: u, password: p }) });
        var data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
        token = data.token; myName = data.username; save();
        authPass.value = "";
        showChat(); connect();
      } catch (err) { authErr.textContent = err.message; }
      finally { btnLogin.disabled = btnSignup.disabled = false; }
    }
    btnLogin.onclick = function () { doAuth("/chat/login"); };
    btnSignup.onclick = function () { doAuth("/chat/signup"); };
    authPass.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doAuth("/chat/login"); } });

    logoutBtn.onclick = function () {
      var t = token; clearAuth();
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
      box.innerHTML = ""; channelsEl.innerHTML = "";
      fetch("/chat/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: t }) }).catch(function () {});
      showAuth();
    };

    function renderChannels(list) {
      channelsEl.innerHTML = "";
      list.forEach(function (ch) {
        var b = document.createElement("button");
        b.className = "channel" + (ch === channel ? " active" : "");
        b.dataset.ch = ch;
        var h = document.createElement("span"); h.className = "hash"; h.textContent = "#";
        b.appendChild(h); b.appendChild(document.createTextNode(ch));
        b.onclick = function () { switchChannel(ch); };
        channelsEl.appendChild(b);
      });
    }
    function setActiveChannel(ch) {
      channel = ch;
      titleEl.textContent = "#" + ch;
      input.placeholder = "Message #" + ch + "  (try /help)";
      Array.prototype.forEach.call(channelsEl.children, function (b) { b.classList.toggle("active", b.dataset.ch === ch); });
    }
    function switchChannel(ch) {
      if (ch === channel || !ws || ws.readyState !== WebSocket.OPEN) { if (ch) setActiveChannel(ch); return; }
      setActiveChannel(ch);
      box.innerHTML = "";
      ws.send(JSON.stringify({ type: "join", channel: ch }));
    }

    function atBottom() { return box.scrollHeight - box.scrollTop - box.clientHeight < 60; }
    function scroll() { box.scrollTop = box.scrollHeight; }
    function addMsg(m) {
      var stick = atBottom();
      var el = document.createElement("div");
      el.className = "msg " + (m.name === myName ? "me" : "them");
      if (m.name !== myName) {
        var meta = document.createElement("div"); meta.className = "meta";
        meta.appendChild(document.createTextNode(m.name));
        if (m.role === "owner" || m.role === "admin") {
          var b = document.createElement("span"); b.className = "badge " + m.role; b.textContent = m.role; meta.appendChild(b);
        }
        el.appendChild(meta);
      }
      var body = document.createElement("div"); body.textContent = m.text; el.appendChild(body);
      box.appendChild(el);
      if (stick) scroll();
    }
    function addSystem(text) {
      var el = document.createElement("div"); el.className = "msg system"; el.textContent = text; box.appendChild(el); scroll();
    }

    var ws = null, delay = 1000, reconnectTimer = null;

    function wsUrl() {
      var proto = location.protocol === "https:" ? "wss://" : "ws://";
      return proto + location.host + "/chat?token=" + encodeURIComponent(token);
    }

    function scheduleReconnect() {
      if (!token || reconnectTimer) return;
      reconnectTimer = setTimeout(function () {
        reconnectTimer = null;
        connect();
      }, delay);
      delay = Math.min(delay * 2, 15000);
    }

    async function handleDisconnect(connectionToken, event) {
      if (token !== connectionToken) return;
      if (event.code === 4003) {
        clearAuth();
        showAuth();
        authErr.textContent = "You have been banned from this room.";
        return;
      }

      try {
        var res = await fetch("/chat/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({ token: connectionToken })
        });
        if (token !== connectionToken) return;
        if (res.status === 401) {
          clearAuth();
          showAuth();
          authErr.textContent = "Session expired or you were removed, please log in again.";
          return;
        }
      } catch (_) {
        // Server/network unavailable: retain the token and retry.
      }

      if (token === connectionToken) scheduleReconnect();
    }

    function connect() {
      if (!token) { showAuth(); return; }
      var connectionToken = token;
      var socket = new WebSocket(wsUrl());
      ws = socket;

      socket.onopen = function () {
        if (ws !== socket) return;
        dot.classList.add("on");
        delay = 1000;
      };

      socket.onmessage = function (e) {
        if (ws !== socket) return;
        var data; try { data = JSON.parse(e.data); } catch (_) { return; }
        if (data.type === "welcome" || data.type === "role") {
          myRole = data.role || "member";
          if (data.type === "welcome") {
            renderChannels(data.channels || []);
            setActiveChannel(data.channel || "general");
          }
          whoEl.innerHTML = "";
          whoEl.appendChild(document.createTextNode("@" + myName));
          if (myRole === "owner" || myRole === "admin") { var bb = document.createElement("span"); bb.className = "badge " + myRole; bb.textContent = myRole; whoEl.appendChild(bb); }
          hintEl.textContent = (myRole === "owner" || myRole === "admin") ? "/help for mod commands" : "";
        } else if (data.type === "history") {
          if (data.channel && data.channel !== channel) return;
          box.innerHTML = "";
          (data.messages || []).forEach(addMsg);
          scroll();
        } else if (data.type === "msg") {
          if (data.channel && data.channel !== channel) return;
          addMsg(data);
        } else if (data.type === "system") {
          addSystem(data.text);
        }
      };

      socket.onclose = function (e) {
        if (ws !== socket) return;
        ws = null;
        dot.classList.remove("on");
        handleDisconnect(connectionToken, e);
      };

      socket.onerror = function () { try { socket.close(); } catch (_) {} };
    }

    function send() {
      var text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ text: text }));
      input.value = ""; input.focus();
    }
    sendBtn.onclick = send;
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); send(); } });

    if (token && myName) { showChat(); connect(); }
    else { showAuth(); }
  })();
  </script>

</body>
</html>
