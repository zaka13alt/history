<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox</title>
<link rel="icon" href="/img/icos/roblox.svg">
<style>
  :root{--bar:#000;--ink:#e6edf7;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1120;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #bar{height:48px;background:var(--bar);display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--ink)}
  #bar .brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em}
  #bar .brand img{width:22px;height:22px}
  #bar .addr{flex:1;min-width:0;color:#9fb0c6;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar button{border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:#000}
  #bar .login{background:#000} #bar .login:hover{background:#161616}
  #bar .player{background:#000} #bar .player:hover{background:#161616}
  #wrap{position:absolute;top:48px;left:0;right:0;bottom:0}
  #f{width:100%;height:100%;border:0;background:#fff}
  #boot{position:absolute;inset:48px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000}
  #boot .sp{width:42px;height:42px;border:4px solid rgba(255,255,255,.2);border-top-color:#3b82f6;border-radius:50%;animation:s 1s linear infinite;filter:drop-shadow(0 0 12px rgba(59,130,246,.5))}
  #boot-t{color:#aaa;font-size:14px;letter-spacing:.5px;text-transform:lowercase}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="bar">
  <span class="brand"><img src="/img/icos/roblox.svg" alt="">Roblox</span>
  <span class="addr" id="addr">loading…</span>
  <button class="login" id="login" type="button">Log in to roblox.com</button>
  <button class="player" id="player" type="button" title="Open the player / paste a game link">Player</button>
</div>
<div id="wrap">
  <iframe id="f" title="Roblox"></iframe>
  <div id="boot"><div class="sp"></div><div id="boot-t">Starting…</div></div>
</div>

<script src="/stuff/loz2PSkv/3euG74Zc.js"></script>
<script src="/stuff/loz2PSkv/xNHsqV3x.js"></script>
<script src="/stuff/loz2PSkv/C22VhTU9.js"></script>
<script src="/js/ZNuSyiF.js?v=055848f6"></script>
<script src="/.assets/index-nDtXnT.js"></script>
<script src="/blox/webblox-launch.js"></script>

<script>
(function () {
  "use strict";
  var WISP = "wss://" + location.host + "/api/";
  var BLOX_WISP = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/wisp/";
  var iframe = document.getElementById("f");
  var addr = document.getElementById("addr");
  var boot = document.getElementById("boot");
  var bootT = document.getElementById("boot-t");
  var SANDBOX = "allow-same-origin allow-scripts allow-forms allow-modals allow-downloads allow-pointer-lock allow-storage-access-by-user-activation allow-popups allow-popups-to-escape-sandbox";

  var ready = null;
  function controller() {
    if (ready) return ready;
    ready = (async function () {
      var transport = new window.libbyTransport.libbyClient({ ww: WISP });
      await transport.init();
      var reg = await navigator.serviceWorker.register("/HHbaN.js", { scope: "/", updateViaCache: "none" });
      var worker = reg.active || await new Promise(function (res) {
        var w = reg.installing || reg.waiting;
        w.addEventListener("statechange", function () { if (w.state === "activated") res(w); });
      });
      var ctrl = new window.$K5qkWTpAController.Controller({
        serviceworker: worker,
        transport: transport,
        config: {
          prefix: "/TxRQenir/",
          K5qkWTpAPath: "/stuff/loz2PSkv/3euG74Zc.js",
          injectPath: "/stuff/loz2PSkv/tgD2nbJS.js",
          wasmPath: "/stuff/loz2PSkv/jCC9IUDB.wasm"
        }
      });
      await ctrl.wait();
      return ctrl;
    })();
    ready.catch(function () { ready = null; });
    return ready;
  }

  function plugins() {
    var U = window.$K5qkWTpAUtils, p = [];
    try {
      if (U.HttpCachePlugin) p.push(new U.HttpCachePlugin());
      // Roblox "Play" -> open the full webblox player at /blox/ (same origin:
      // cross-origin isolated by the server, Wisp at /wisp/, shared cookie jar).
      if (window.webbloxLaunch && U.ManagedPlugin) {
        p.push(window.webbloxLaunch.create(U.ManagedPlugin, "/blox/", BLOX_WISP));
      }
      if (U.UrlWatcherPlugin) p.push(new U.UrlWatcherPlugin(function (u) {
        try { addr.textContent = new URL(u).hostname; } catch (e) { addr.textContent = u; }
      }));
    } catch (e) { console.error("plugin setup", e); }
    return p;
  }

  var frame = null;
  async function go(url) {
    iframe.setAttribute("sandbox", SANDBOX);
    bootT.textContent = "Connecting…";
    boot.style.display = "flex";
    try {
      var ctrl = await controller();
      if (!frame) frame = ctrl.createFrame(iframe, { plugins: plugins() });
      frame.go(url);
      addr.textContent = (function () { try { return new URL(url).hostname; } catch (e) { return url; } })();
      setTimeout(function () { boot.style.display = "none"; }, 1200);
    } catch (e) {
      bootT.textContent = "Couldn't start: " + (e && e.message || e);
    }
  }

  document.getElementById("login").addEventListener("click", function () { go("https://www.roblox.com/login"); });
  document.getElementById("player").addEventListener("click", function () { window.open("/blox/", "_blank"); });
  // Auto-open roblox.com so the user can sign in and pick a game.
  go("https://www.roblox.com/");
})();
</script>
</body>
</html>
