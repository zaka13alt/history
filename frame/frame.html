    // Decode a base64 param. Tolerant of URL-safe base64 (-_), of '+' that a query
    // string turned into a space, and of missing '=' padding. Handles UTF-8.
    function b64dec(s) {
        if (!s) return "";
        try {
            s = String(s).replace(/-/g, "+").replace(/_/g, "/").replace(/ /g, "+");
            while (s.length % 4) s += "=";

    // Drop any service worker registered by the OTHER backend so the chosen one controls

                if (url.indexOf(keepFile) === -1) { try { await regs[i].unregister(); } catch (e) {} }
            }
        } catch (e) {}

    // ss backend: libby transport + cf solver, same as study.html.

        var activeWorker = swReg.active || await new Promise(function (resolve) {

            }
        });
        await ctrl.wait();

        // proxied frame.html tab (base64 ?g=), never the raw URL.
        var nw = window.zakaNewWindowPlugin && window.zakaNewWindowPlugin(function (u) {

        if (!frame) throw new Error("createFrame returned null");

    // Ultraviolet backend: same wiring as uvthing/index.html, using the modified u22 files.
    async function bootu22() {

        var connection = new window.W1I41.W1I41Connection("/frame/ikfZf.js");

        if (!swReg.active) {
