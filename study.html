function faviconCandidates(pageUrl) {
    try {
        if (!/^https?:\/\//i.test(pageUrl)) return [];
        var host = new URL(pageUrl).host;
        if (!host) return [];
        var hosts = [host];
        if (host.indexOf('www.') !== 0 && host.split('.').length <= 2) hosts.unshift('www.' + host);
        var out = [];
        ['ico', 'png'].forEach(function (ext) {
            hosts.forEach(function (h) { out.push('/np/https://' + h + '/favicon.' + ext); });
        });
        return out;
    } catch (_) { return []; }
}

function loadFavicon(img, pageUrl, onFail) {
    var list = faviconCandidates(pageUrl);
    var idx = 0;
    function next() {
        if (idx >= list.length) { img.onerror = null; if (onFail) onFail(); return; }
        img.src = list[idx++];
    }
    img.onerror = next;
    next();
}

function applyFavicon(tb, url) {
    if (!tb || !tb.faviconImg) return;
    var img = tb.faviconImg;
    if (!faviconCandidates(url).length) { img.style.display = 'none'; return; }
    img.style.display = 'block';

}

// Event Listeners
// Search suggestions (/s/<query> -> Google suggest via Caddy)
(function () {
    var box = document.getElementById('p1tl9');
    var items = [], sel = -1, typed = '', timer = 0, ctrl = null;
    function hide() { box.style.display = 'none'; box.textContent = ''; items = []; sel = -1; if (ctrl) { ctrl.abort(); ctrl = null; } }
    function mark(i) {
        items.forEach(function (el, j) { el.classList.toggle('r0hni', j === i); });
        sel = i;
        addrInput.value = i < 0 ? typed : items[i].textContent;
    }
    function choose(text) {
        addrInput.value = text;
        hide();
        addrInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    }
    function show(list) {
        box.textContent = ''; items = []; sel = -1;
        list.slice(0, 8).forEach(function (text) {
            var row = document.createElement('div');
            row.className = 'hare7';
            var icon = document.createElement('i');
            icon.className = 'fa-solid fa-magnifying-glass';
            var label = document.createElement('span');
            label.textContent = text;
            row.appendChild(icon); row.appendChild(label);
            row.addEventListener('mousedown', function (e) { e.preventDefault(); choose(text); });
            box.appendChild(row); items.push(row);
        });
        box.style.display = items.length ? 'block' : 'none';
    }
    addrInput.addEventListener('input', function () {
        typed = addrInput.value;
        clearTimeout(timer);
        var q = typed.trim();
        if (!q || /^education:\/\//i.test(q)) { hide(); return; }
        timer = setTimeout(function () {
            if (ctrl) ctrl.abort();
            var mine = ctrl = new AbortController();
            fetch('/s/' + encodeURIComponent(q), { signal: mine.signal })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (d) {
                    if (mine !== ctrl || addrInput.value !== typed || document.activeElement !== addrInput) return;
                    show(Array.isArray(d) && Array.isArray(d[1]) ? d[1].filter(function (x) { return typeof x === 'string'; }) : []);
                })
                .catch(function () {});
        }, 130);
    });
    addrInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { clearTimeout(timer); hide(); return; }
        if (!items.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); mark(sel + 1 >= items.length ? -1 : sel + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); mark(sel - 1 < -1 ? items.length - 1 : sel - 1); }
        else if (e.key === 'Escape') { mark(-1); hide(); }
    });
    addrInput.addEventListener('blur', function () { setTimeout(hide, 120); });
})();

addrInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        var val = addrInput.value.trim();
        var tb = tbs.get(activeTbId);
        if (!val || !tb) return;
        showLoad();
        if (val === settingsUrl || val === page50000 || val === page50001 || val === page50002 || val.startsWith('education://')) {
            tb.url = settingsUrl; tb.title.textContent = 's3ttin7gs'; openSettings(tb); return;
        }
        var parsed = parseInput(val);
        if (!parsed) return;
        tb.url = parsed;
        tb.title.textContent = parsed.replace(/^https?:\/\//,'').split('/')[0] || val;
        hideNewTb(tb);
        navigateTb(parsed, activeTbId);
    }
});

// Online Counter
(function() {
    var el = document.getElementById('use-count'), n = document.getElementById('use-count-n');
    var id;
    try { id = localStorage.getItem('z938fafhp'); } catch(e) {}
    if (!id || !/^[A-Za-z0-9_-]{16,64}$/.test(id)) {
        var b = crypto.getRandomValues(new Uint8Array(16));
        id = Array.prototype.map.call(b, function(x) { return ('0' + x.toString(16)).slice(-2); }).join('');
        try { localStorage.setItem('z938fafhp', id); } catch(e) {}
    }
    var delay = 1000;
    function connect() {
        var ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/use/?id=' + id);
        ws.onmessage = function(e) { try { n.textContent = JSON.parse(e.data).online; el.classList.add('on'); delay = 1000; } catch(_) {} };
        ws.onclose = function() { el.classList.remove('on'); setTimeout(connect, delay); delay = Math.min(delay * 2, 30000); };
    }
    connect();
})();

createTb();
