    rect.setAttribute("width", "100%"); rect.setAttribute("height", "100%"); rect.setAttribute("fill", "#000"); rect.setAttribute("rx", "4");
    var text = document.createElementNS(svgNS, "text");
    text.setAttribute("x", "50%"); text.setAttribute("y", "55%"); text.setAttribute("fill", "#fff");
    text.setAttribute("font-family", "system-ui,sans-serif"); text.setAttribute("font-size", "12");
    text.setAttribute("font-weight", "600"); text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "middle"); text.setAttribute("letter-spacing", "0.5");
    text.textContent = "zaka";
    svg.appendChild(rect); svg.appendChild(text);
    
    var grid = document.createElement('div');
    grid.className = 'w7x8y';
    newTabPage.appendChild(svg);
    newTabPage.appendChild(grid);

    tabBar.insertBefore(tabEl, plusBtn);
    viewRoot.appendChild(iframe);
    viewRoot.appendChild(newTabPage);

    var tab = { id: id, tab: tabEl, iframe: iframe, title: title, url: startUrl || '', newTabPage: newTabPage, settingsPage: null, shortcutsContainer: grid, frame: null, wisp: wispServer, isA1: false, faviconImg: favImg };
    tabs.set(id, tab);
    renderShortcuts(grid, tab);
    activateTab(id);

    if (startUrl) {
        if (startUrl === settingsUrl || startUrl === page50000 || startUrl === page50001 || startUrl === page50002) {
            openSettings(tab);
        } else {
            navigateTab(startUrl, id);
        }
    }
    return id;
}

function closeTab(id) {
    var tab = tabs.get(id);
    if (!tab) return;
    var wasActive = activeTabId === id;
    tab.tab.remove();
    tab.iframe.remove();
    if (tab.newTabPage) tab.newTabPage.remove();
    if (tab.settingsPage) tab.settingsPage.remove();
    tabs.delete(id);
    if (tabs.size === 0) { createTab(); return; }
    if (wasActive) {
        var keys = Array.from(tabs.keys());
        var idx = keys.indexOf(id);
        activateTab(keys[Math.max(0, idx - 1)]);
    }
}

function activateTab(id) {
    var tab = tabs.get(id);
    if (!tab) return;
    tabs.forEach(function(t) {
        t.tab.classList.remove('i3j4k');
        t.iframe.classList.remove('n1o2p');
        if (t.newTabPage) t.newTabPage.style.display = 'none';
        if (t.settingsPage) t.settingsPage.classList.remove('n1o2p');
    });
    tab.tab.classList.add('i3j4k');
    activeTabId = id;
    
    if (tab.url === settingsUrl || tab.url === page50000 || tab.url === page50001 || tab.url === page50002) {
        openSettings(tab);
    } else if (tab.isA1) {
        tab.iframe.classList.add('n1o2p');
        addrInput.value = a1Url;
        document.getElementById('p5q6r').innerHTML = '<i class="fa-solid fa-lock"></i>';
    } else if (tab.url) {
        tab.iframe.classList.add('n1o2p');
        addrInput.value = tab.url;
        updateLockIcon(tab.url);
    } else {
        if (tab.newTabPage) tab.newTabPage.style.display = 'flex';
        addrInput.value = '';
        document.getElementById('p5q6r').innerHTML = '<i class="fa-solid fa-globe"></i>';
    }
}

function hideNewTab(tab) {
    if (tab.newTabPage) tab.newTabPage.style.display = 'none';
    tab.iframe.classList.remove('n1o2p');
    if (tab.settingsPage) tab.settingsPage.classList.remove('n1o2p');
}

function showNewTab(tab) {
    if (tab.newTabPage) tab.newTabPage.style.display = 'flex';
    if (tab.settingsPage) tab.settingsPage.classList.remove('n1o2p');
}

function renderShortcuts(container, tab) {
    container.innerHTML = '';
    shortcuts.forEach(function(s) {
        var t = document.createElement('div');
        t.className = 'z9a0b';
        t.title = s.url;
        var ic = document.createElement('div');
        ic.className = 'c1d2e';
        var icon = document.createElement('i');
        icon.className = s.icon || 'fa-solid fa-globe';
        ic.appendChild(icon);
        var name = document.createElement('div');
        name.className = 'f3g4h';
        name.textContent = s.name;
        t.appendChild(ic); t.appendChild(name);
        t.addEventListener('click', function() {
            if (!tab) return;
            tab.url = s.url;
            tab.title.textContent = s.name;
            hideNewTab(tab);
            navigateTab(s.url, tab.id);
        });
        container.appendChild(t);
    });
    var dc = document.createElement('a');
    dc.className = 'discord-link';
    dc.href = 'https://discord.gg/Y26EUssP3';
    dc.target = '_blank';
    var dci = document.createElement('img');
    dci.src = '/dc.svg';
    dci.alt = 'discord';
    var dcs = document.createElement('span');
    dcs.textContent = 'join the discord';
    dc.appendChild(dci); dc.appendChild(dcs);
    container.appendChild(dc);
}

function parseInput(input) {
    var val = input.trim();
    if (!val) return null;
    if (/^https?:\/\/\S+$/i.test(val)) return val;
    return searchEngine.replace('%s', encodeURIComponent(val));
}

function navigateTab(url, tabId) {
    var tab = tabs.get(tabId);
    if (!tab) return;
    hideNewTab(tab);
    
    var executeNav = async function() {
        try {
            if (backendMode === "ultrev") {
                // Fallback to Ultravi0let mode if configured
                await ensureController(wispServer);
                if (!tab.frame) tab.frame = controllerState.controller.createFrame(tab.iframe);
                tab.frame.go(url);
            } else {
                await navigateFrame(tab, url, wispServer);
            }
            tab.url = url;
            addrInput.value = url;
            updateLockIcon(url);
            try { tab.title.textContent = new URL(url).hostname; } catch(e) { tab.title.textContent = url; }
            tab.iframe.classList.add('n1o2p');
            applyFavicon(tab, url);
        } catch(err) {
            console.error(err);
        }
    };
    executeNav();
}

function openSettings(tab) {
    if (!tab.settingsPage) {
        tab.settingsPage = document.createElement('div');
        tab.settingsPage.className = 'i5j6k';
        
        var wrap = document.createElement('div');
        wrap.className = 'l7m8n';

        var hd = document.createElement('div');
        hd.className = 'o9p0q';
        var backBtn = document.createElement('button');
        backBtn.className = 'r1s2t';
        backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i>';
        backBtn.onclick = function() {
            tab.url = '';
            tab.title.textContent = 'n3w t3b';
            showNewTab(tab);
            activateTab(tab.id);
            addrInput.value = '';
            document.getElementById('p5q6r').innerHTML = '<i class="fa-solid fa-globe"></i>';
            clearFavicon(tab);
        };
        var tt = document.createElement('div');
        tt.className = 'u3v4w';
        tt.textContent = 's3ttin7gs';
        hd.appendChild(backBtn); hd.appendChild(tt);
        
        var secNet = document.createElement('div');
        secNet.className = 'x5y6z';
        var hNet = document.createElement('div');
        hNet.className = 'a7b8c'; hNet.textContent = 'Network';
        var rNet = document.createElement('div');
        rNet.className = 'd9e0f';
        var lNet = document.createElement('div');
        lNet.className = 'g1h2i'; lNet.innerHTML = '<div class="j3k4l">w13p</div><div class="m5n6o">self explanitory</div>';
        var inpNet = document.createElement('input');
        inpNet.className = 'p7q8r'; inpNet.type = 'text'; inpNet.value = wispServer; inpNet.placeholder = 'wss://w13p.example.com/api/';
        rNet.appendChild(lNet); rNet.appendChild(inpNet); secNet.appendChild(hNet); secNet.appendChild(rNet);

        var secSrch = document.createElement('div');
        secSrch.className = 'x5y6z';
        var hSrch = document.createElement('div');
        hSrch.className = 'a7b8c'; hSrch.textContent = 'Search';
        var rSrch = document.createElement('div');
        rSrch.className = 'd9e0f';
        var lSrch = document.createElement('div');
        lSrch.className = 'g1h2i'; lSrch.innerHTML = '<div class="j3k4l">search engine</div><div class="m5n6o"></div>';
        var selSrch = document.createElement('select');
        selSrch.className = 's9t0u';
        var engines = [{v:"https://duckduckgo.com/search?q=%s",n:'DuckDuckGo'},{v:"https://www.google.com/search?q=%s",n:'Google'},{v:"https://www.bing.com/search?q=%s",n:'Bing'},{v:"https://search.brave.com/search?q=%s",n:'Brave'}];
        engines.forEach(function(o) {
            var op = document.createElement('option');
            op.value = o.v; op.textContent = o.n;
            if (o.v === searchEngine) op.selected = true;
            selSrch.appendChild(op);
        });
        rSrch.appendChild(lSrch); rSrch.appendChild(selSrch); secSrch.appendChild(hSrch); secSrch.appendChild(rSrch);

        var secAct = document.createElement('div');
        secAct.className = 'x5y6z';
        var hAct = document.createElement('div');
        hAct.className = 'a7b8c'; hAct.textContent = 'Actions';
        var rAct = document.createElement('div');
        rAct.className = 'd9e0f';
        var lAct = document.createElement('div');
        lAct.className = 'g1h2i'; lAct.innerHTML = '<div class="j3k4l">Save settings</div><div class="m5n6o">apply + refresh stuff + save changes</div>';
        var saveBtn = document.createElement('button');
        saveBtn.className = 'v1w2x'; saveBtn.textContent = 'Save';
        saveBtn.onclick = function() {
            var v = inpNet.value.trim();
            if (v && v.startsWith('wss://')) { wispServer = v; localStorage.setItem(storageWisp, v); }
            searchEngine = selSrch.value;
            localStorage.setItem(storageSearch, searchEngine);
            saveBtn.textContent = 'Saved';
            setTimeout(function() { saveBtn.textContent = 'Save'; }, 1200);
        };
        rAct.appendChild(lAct); rAct.appendChild(saveBtn); secAct.appendChild(hAct); secAct.appendChild(rAct);

        wrap.appendChild(hd); wrap.appendChild(secNet); wrap.appendChild(secSrch); wrap.appendChild(secAct);
        tab.settingsPage.appendChild(wrap);
        viewRoot.appendChild(tab.settingsPage);
    }
    
    tabs.forEach(function(t) {
        t.iframe.classList.remove('n1o2p');
        if (t.newTabPage) t.newTabPage.style.display = 'none';
        if (t.settingsPage) t.settingsPage.classList.remove('n1o2p');
    });
    tab.settingsPage.classList.add('n1o2p');
    tab.iframe.classList.remove('n1o2p');
    if (tab.newTabPage) tab.newTabPage.style.display = 'none';
    addrInput.value = settingsUrl;
    tab.url = settingsUrl;
    tab.title.textContent = 's3ttin7gs';
    document.getElementById('p5q6r').innerHTML = '<i class="fa-solid fa-gear"></i>';
    activeTabId = tab.id;
    clearFavicon(tab);
}

// Event Listeners
addrInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        var val = addrInput.value.trim();
        var tab = tabs.get(activeTabId);
        if (!val || !tab) return;
        showLoad();
        if (val === settingsUrl || val === page50000 || val === page50001 || val === page50002 || val.startsWith('education://')) {
            tab.url = settingsUrl; tab.title.textContent = 's3ttin7gs'; openSettings(tab); return;
        }
        var parsed = parseInput(val);
        if (!parsed) return;
        tab.url = parsed;
        tab.title.textContent = parsed.replace(/^https?:\/\//,'').split('/')[0] || val;
        hideNewTab(tab);
        navigateTab(parsed, activeTabId);
    }
});

plusBtn.onclick = function() { createTab(); };
backBtn.onclick = function() { var t = tabs.get(activeTabId); if (t && t.frame && t.frame.go) { try { t.iframe.contentWindow.history.back(); } catch(e){} } };
fwdBtn.onclick = function() { var t = tabs.get(activeTabId); if (t && t.frame && t.frame.go) { try { t.iframe.contentWindow.history.forward(); } catch(e){} } };
reloadBtn.onclick = function() { var t = tabs.get(activeTabId); if (t && t.url) navigateTab(t.url, activeTabId); };
starBtn.onclick = function() { var i = starBtn.querySelector('i'); i.classList.toggle('fa-regular'); i.classList.toggle('fa-solid'); };
settingsBtn.onclick = function() { var t = tabs.get(activeTabId); if (t) { t.url = settingsUrl; t.title.textContent = 's3ttin7gs'; openSettings(t); } };

document.getElementById('sidebar-game').onclick = function() {
    var id = createTab();
    var t = tabs.get(id);
    if (t) { t.iframe.src = gamesUrl; t.url = gamesPath; t.title.textContent = 'g@mez'; addrInput.value = gamesPath; document.getElementById('p5q6r').innerHTML = '<i class="fa-solid fa-lock"></i>'; hideNewTab(t); t.iframe.classList.add('n1o2p'); clearFavicon(t); }
};

document.getElementById('sidebar-a1').onclick = function() {
    var id = createTab(a1Url);
    var t = tabs.get(id);
    if (t) { t.isA1 = true; navigateTab(a1ActualUrl, id); t.url = a1Url; t.title.textContent = 'A1'; addrInput.value = a1Url; document.getElementById('p5q6r').innerHTML = '<i class="fa-solid fa-lock"></i>'; clearFavicon(t); }
};

// Online Counter
(function() {
    var el = document.getElementById('use-count'), n = document.getElementById('use-count-n');
    var id;
    try { id = localStorage.getItem('use_id'); } catch(e) {}
    if (!id || !/^[A-Za-z0-9_-]{16,64}$/.test(id)) {
        var b = crypto.getRandomValues(new Uint8Array(16));
        id = Array.prototype.map.call(b, function(x) { return ('0' + x.toString(16)).slice(-2); }).join('');
        try { localStorage.setItem('use_id', id); } catch(e) {}
    }
    var delay = 1000;
    function connect() {
        var ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/use/?id=' + id);
        ws.onmessage = function(e) { try { n.textContent = JSON.parse(e.data).online; el.classList.add('on'); delay = 1000; } catch(_) {} };
        ws.onclose = function() { el.classList.remove('on'); setTimeout(connect, delay); delay = Math.min(delay * 2, 30000); };
    }
    connect();
})();

createTab();
})();
</script>
